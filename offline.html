<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No connection — Bēsia Beauty Studio</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .off-wrap{min-height:100svh;display:grid;place-items:center;padding:2rem 1.25rem;
      background:linear-gradient(160deg,var(--espresso) 0%,var(--espresso-deep) 100%);
      color:var(--cream);text-align:center}
    .off-inner{max-width:520px}
    .off-mark{width:58px;height:58px;margin:0 auto 1.5rem;color:var(--gold-light)}
    .off-wrap h1{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.3rem);margin-bottom:.9rem}
    .off-wrap p{color:var(--cream-soft);font-weight:300;margin-bottom:1.6rem}
  </style>
</head>
<body>
  <main class="off-wrap">
    <div class="off-inner">
      <svg class="off-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 41V26a12 12 0 0 1 24 0v15"/>
        <path d="M18.5 41V30.5" opacity=".6"/><path d="M24 41V27.5" opacity=".6"/><path d="M29.5 41V30.5" opacity=".6"/>
        <path d="M18.5 9h11"/>
      </svg>
      <h1>You are offline</h1>
      <p>This page has not been opened on this device before, so there is nothing saved to show you.
         Any page you have already visited will still work.</p>
      <p>Call us on <a href="tel:+233240787993" style="color:var(--gold-light);text-decoration:underline">024 078 7993</a>
         — we are open Mon–Sat, 9am – 7pm.</p>
      <a href="./index.html" class="btn btn--gold">Try the home page</a>
    </div>
  </main>
</body>
</html>
