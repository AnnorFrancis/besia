  <script>
  /* Boot, inline and tiny: marks the page as scripted, decides the
     effects tier, and whether the issue opens with its intro. Storage
     is wrapped because Safari's private mode throws on it. */
  (function () {
    var h = document.documentElement, n = navigator, c = n.connection || {};
    h.classList.add('js');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lite = !!(c.saveData || /(^|[^3-9])2g/.test(c.effectiveType || '') || (n.deviceMemory && n.deviceMemory <= 3) || (n.hardwareConcurrency && n.hardwareConcurrency <= 2));
    h.setAttribute('data-fx', lite || reduce ? 'lite' : 'full');
    if (reduce) h.setAttribute('data-reduce', '');
    var home = document.currentScript && /index\.html$|\/$/.test(location.pathname) && !location.hash && !location.search;
    if (home && !lite && !reduce) {
      try {
        if (!sessionStorage.getItem('besia-opened')) { sessionStorage.setItem('besia-opened', '1'); h.classList.add('intro'); }
      } catch (e) {}
    }
  })();
  </script>
