  <style>
    .nf-wrap {
      min-height: 100svh;
      display: grid; place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(156, 107, 51, 0.22), transparent 62%),
        linear-gradient(160deg, var(--espresso) 0%, var(--espresso-deep) 100%);
      color: var(--cream);
      text-align: center;
    }
    .nf-inner { max-width: 620px; }
    .nf-mark { width: 62px; height: 62px; margin: 0 auto 1.6rem; color: var(--gold-light); }
    .nf-code {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(3.2rem, 12vw, 5.5rem); line-height: 1;
      color: var(--gold-light); margin-bottom: 0.4rem;
    }
    .nf-wrap h1 {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      margin-bottom: 1rem; color: var(--cream);
    }
    .nf-wrap p { color: var(--cream-soft); margin-bottom: 2rem; font-weight: 300; }
    .nf-links { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
    .nf-links a {
      padding: 0.85rem 1.5rem; border-radius: 999px;
      border: 1px solid var(--glass-border);
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      transition: background 0.2s var(--ease-out), color 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
    }
    .nf-links a:hover, .nf-links a:focus-visible { background: var(--cream); color: var(--espresso); border-color: var(--cream); }
    .nf-links a.is-primary { background: var(--gold); border-color: var(--gold); color: #fff; }
    .nf-links a.is-primary:hover { background: var(--gold-light); border-color: var(--gold-light); color: var(--espresso-deep); }
    .nf-foot { margin-top: 2.4rem; font-size: 0.82rem; color: var(--stone); }
    .nf-foot a { text-decoration: underline; }
  </style>
</head>
